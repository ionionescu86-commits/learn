<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicatie cu doua butoane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Aplicatie cu doua butoane</h1>
    <p>Alege unul dintre butoane si vezi mesajul afisat.</p>

    <div class="buttons">
      <button id="redButton" class="button red" type="button">Buton rosu</button>
      <button id="greenButton" class="button green" type="button">Buton verde</button>
    </div>

    <p id="message" class="message" aria-live="polite">Apasa un buton.</p>
  </main>

  <script>
    const message = document.getElementById("message");
    const redButton = document.getElementById("redButton");
    const greenButton = document.getElementById("greenButton");

    redButton.addEventListener("click", () => {
      message.textContent = "visezi";
    });

    greenButton.addEventListener("click", () => {
      message.textContent = "te-ai trezit";
    });
  </script>
</body>
</html>
