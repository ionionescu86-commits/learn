<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicatie protejata</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="loginPanel" class="panel">
      <h1>Autentificare</h1>
      <p>Introdu emailul si parola pentru a accesa aplicatia.</p>

      <form id="loginForm" class="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Parola</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button class="login-button" type="submit">Intra in aplicatie</button>
      </form>

      <p id="loginMessage" class="error" aria-live="polite"></p>
    </section>

    <section id="appPanel" class="app panel hidden">
      <div class="top-bar">
        <p>Logat ca: <strong id="userEmail"></strong></p>
        <button id="logoutButton" class="logout-button" type="button">Delogare</button>
      </div>

      <h1>Aplicatie cu doua butoane</h1>
      <p>Alege unul dintre butoane si vezi mesajul afisat.</p>

      <div class="buttons">
        <button id="redButton" class="button red" type="button">Buton rosu</button>
        <button id="greenButton" class="button green" type="button">Buton verde</button>
      </div>

      <p id="message" class="message" aria-live="polite">Apasa un buton.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
